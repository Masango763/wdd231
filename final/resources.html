            <p>Get in touch with agricultural advisors or access helpful farming guides.</p>
            
            <form action="thankyou.html" method="get" style="margin-top: 1.5rem; display: flex; flex-direction: column; gap: 1rem; max-width: 500px;">

                <label>Email: <input type="email" name="femail" required style="padding: 0.5rem; width: 100%;"></label>
                <label>Message: <textarea name="fmsg" required style="padding: 0.5rem; width: 100%; height: 100px;"></textarea></label>
                <button type="submit" class="btn" style="border: none; cursor: pointer;">Submit Inquiry</button>
            </form>
