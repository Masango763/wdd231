<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgriPulse Zimbabwe - Submission Summary</title>
    <link rel="stylesheet" href="styles.css">
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const container = document.getElementById('form-results');
            container.innerHTML = `
                <p><strong>Name:</strong> ${params.get('fname') || 'N/A'}</p>
                <p><strong>Email:</strong> ${params.get('femail') || 'N/A'}</p>
                <p><strong>Message:</strong> ${params.get('fmsg') || 'N/A'}</p>
            `;
        });
    </script>
</head>
<body>
    <header>
        <h1>AgriPulse Zimbabwe</h1>
    </header>
    <main>
        <section>
            <h2>Submission Received</h2>
            <p>Thank you for reaching out. Here are your submitted details:</p>
            <div id="form-results" style="margin-top: 1rem; line-height: 1.8;"></div>
            <br>
            <a href="index.html" class="btn">Return Home</a>
        </section>
    </main>
    <footer>
        <p>&copy; 2026 AgriPulse Zimbabwe.</p>
    </footer>
</body>
</html>
